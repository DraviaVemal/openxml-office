version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/cs"
    exclude-paths: ["test", "tests"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]
      nuget-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directory: "/rs"
